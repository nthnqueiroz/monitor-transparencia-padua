name: Monitor Transparência Pádua

# Diário às 11:00 UTC = 08:00 (Brasília). Rode manualmente pela aba Actions
# escolhendo o modo: "recent" (diário) ou "full" (inventário histórico completo).
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de varredura"
        default: "recent"
        type: choice
        options:
          - recent
          - full

permissions:
  contents: write

concurrency:
  group: monitor-transparencia
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o monitor
        env:
          SCAN_MODE: ${{ github.event.inputs.mode || 'recent' }}
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          WHATSAPP_ENABLED: ${{ vars.WHATSAPP_ENABLED }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python monitor.py

      - name: Salvar estado e inventário (commit)
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state/seen.json inventory.csv inventory.json
          if git diff --staged --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza estado e inventário do monitor [skip ci]"
            git push
          fi
